<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" fill="none" role="img" aria-label="Harmattan AI abstract evidence field">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#070A14"/>
      <stop offset="45%" stop-color="#0C1322"/>
      <stop offset="100%" stop-color="#182238"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#C8AE7D" stop-opacity="0"/>
      <stop offset="18%" stop-color="#C8AE7D" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#EEE9E0" stop-opacity="0.85"/>
      <stop offset="82%" stop-color="#C8AE7D" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#A8854F" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#C8AE7D" stop-opacity="0.28"/>
      <stop offset="55%" stop-color="#2C3C60" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080C18" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- faint grid -->
  <g stroke="#EEE9E0" stroke-opacity="0.035" stroke-width="1">
    <path d="M0 180 H1600 M0 360 H1600 M0 540 H1600 M0 720 H1600"/>
    <path d="M200 0 V900 M400 0 V900 M600 0 V900 M800 0 V900 M1000 0 V900 M1200 0 V900 M1400 0 V900"/>
  </g>
  <!-- arcs like Reflection beam -->
  <g fill="none" stroke="#C8AE7D" stroke-opacity="0.22" stroke-width="1.25" filter="url(#soft)">
    <path d="M-40 620 C220 220, 480 780, 780 420 S1220 180, 1640 520"/>
    <path d="M-20 700 C260 340, 520 820, 820 480 S1260 240, 1660 600"/>
    <path d="M40 500 C300 160, 560 640, 860 360 S1300 120, 1680 440"/>
    <path d="M80 780 C340 480, 600 860, 920 560 S1360 320, 1700 680"/>
  </g>
  <g fill="#C8AE7D">
    <circle cx="210" cy="410" r="4.2" opacity="0.95"/>
    <circle cx="360" cy="280" r="2.8" opacity="0.75"/>
    <circle cx="520" cy="520" r="3.6" opacity="0.9"/>
    <circle cx="690" cy="340" r="3.1" opacity="0.85"/>
    <circle cx="860" cy="230" r="2.4" opacity="0.7"/>
    <circle cx="1020" cy="410" r="3.8" opacity="0.92"/>
    <circle cx="1180" cy="300" r="2.6" opacity="0.72"/>
    <circle cx="1320" cy="470" r="3.2" opacity="0.8"/>
    <circle cx="440" cy="180" r="2.1" opacity="0.55"/>
    <circle cx="980" cy="600" r="2.5" opacity="0.6"/>
    <circle cx="740" cy="650" r="2.2" opacity="0.5"/>
    <circle cx="1480" cy="360" r="2.4" opacity="0.55"/>
  </g>
  <!-- connecting edges -->
  <g stroke="#C8AE7D" stroke-opacity="0.18" stroke-width="1">
    <path d="M210 410 L360 280 L520 520 L690 340 L860 230 L1020 410 L1180 300 L1320 470"/>
    <path d="M520 520 L740 650 L980 600 L1020 410"/>
  </g>
  <rect x="0" y="448" width="1600" height="1.75" fill="url(#beam)"/>
  <text x="72" y="780" fill="#EEE9E0" font-family="Georgia, 'Times New Roman', serif" font-size="34" opacity="0.95">Harmattan AI</text>
  <text x="72" y="818" fill="#7A7D8F" font-family="system-ui, -apple-system, sans-serif" font-size="14" letter-spacing="0.14em">EVIDENCE  ·  HYPOTHESES  ·  PHASED RESEARCH</text>
</svg>
