<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 720" role="img" aria-labelledby="title desc">
  <title id="title">Harmattan AI training evidence: early variants miss the dual gates</title>
  <desc id="desc">ABL2 and ABL4 each scored 16.87 on closed-book domain QA, below the historical gate of 24.65. ABL4 TruthfulQA MC2 fell from 48.01 to 43.01, a five-point decline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#080C18"/>
      <stop offset="1" stop-color="#111B2C"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#788BAA"/>
      <stop offset="1" stop-color="#B6C3D5"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="42%" r="65%">
      <stop offset="0" stop-color="#2C3C60" stop-opacity=".34"/>
      <stop offset="1" stop-color="#080C18" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1600" height="720" fill="url(#bg)"/>
  <rect width="1600" height="720" fill="url(#glow)"/>
  <g stroke="#EEE9E0" stroke-opacity=".035" stroke-width="1">
    <path d="M0 120H1600M0 240H1600M0 360H1600M0 480H1600M0 600H1600"/>
    <path d="M160 0V720M320 0V720M480 0V720M640 0V720M800 0V720M960 0V720M1120 0V720M1280 0V720M1440 0V720"/>
  </g>

  <text x="80" y="66" fill="#C8AE7D" font-family="Arial, sans-serif" font-size="13" font-weight="600" letter-spacing="3">THE TRAINING EVIDENCE</text>
  <text x="1520" y="66" fill="#9BA4B3" font-family="Arial, sans-serif" font-size="12" text-anchor="end" letter-spacing="1.8">HARMATTAN AI  /  RESEARCH NOTE</text>
  <text x="80" y="143" fill="#EEE9E0" font-family="Georgia, 'Times New Roman', serif" font-size="52" font-weight="400" letter-spacing="-1.6">Neither early variant cleared both gates.</text>
  <text x="82" y="180" fill="#A9AEB9" font-family="Arial, sans-serif" font-size="16">Domain QA and general retention tell different parts of the story.</text>

  <rect x="64" y="222" width="944" height="394" rx="3" fill="#0C1321" fill-opacity=".78" stroke="#EEE9E0" stroke-opacity=".13"/>
  <text x="96" y="266" fill="#EEE9E0" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">DOMAIN QA  /  CLOSED BOOK</text>
  <text x="96" y="292" fill="#929BA9" font-family="Arial, sans-serif" font-size="13">Historical v1 gate: 24.65 points</text>

  <g stroke="#EEE9E0" stroke-opacity=".12" stroke-width="1">
    <path d="M350 332V535M533 332V535M716 332V535M900 332V535"/>
    <path d="M350 535H900"/>
  </g>
  <g fill="#8993A3" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">
    <text x="350" y="559">0</text><text x="533" y="559">10</text><text x="716" y="559">20</text><text x="900" y="559">30</text>
  </g>
  <path d="M801 322V536" stroke="#C8AE7D" stroke-width="1.5" stroke-dasharray="5 6"/>
  <rect x="754" y="306" width="94" height="25" rx="12.5" fill="#C8AE7D" fill-opacity=".14"/>
  <text x="801" y="323" fill="#D8C393" font-family="Arial, sans-serif" font-size="10" font-weight="600" text-anchor="middle" letter-spacing=".7">24.65 GATE</text>

  <g fill="#EEE9E0" font-family="Arial, sans-serif" font-size="14" font-weight="600">
    <text x="96" y="395">ABL2</text><text x="96" y="479">ABL4</text>
  </g>
  <g fill="#929BA9" font-family="Arial, sans-serif" font-size="12">
    <text x="96" y="416">raw recipe</text><text x="96" y="500">synthetic recipe</text>
  </g>
  <rect x="350" y="373" width="309" height="28" rx="2" fill="url(#bar)"/>
  <rect x="350" y="457" width="309" height="28" rx="2" fill="url(#bar)"/>
  <g fill="#EEE9E0" font-family="Georgia, 'Times New Roman', serif" font-size="21">
    <text x="675" y="394">16.87</text><text x="675" y="478">16.87</text>
  </g>
  <text x="96" y="591" fill="#C8AE7D" font-family="Arial, sans-serif" font-size="10" font-weight="600" letter-spacing="1.6">BOTH BELOW THE HISTORICAL DOMAIN GATE</text>

  <path d="M1032 222V616" stroke="#EEE9E0" stroke-opacity=".13"/>
  <rect x="1056" y="222" width="480" height="394" rx="3" fill="#0C1321" fill-opacity=".78" stroke="#EEE9E0" stroke-opacity=".13"/>
  <text x="1088" y="266" fill="#EEE9E0" font-family="Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="2">GENERAL RETENTION</text>
  <text x="1088" y="292" fill="#929BA9" font-family="Arial, sans-serif" font-size="13">ABL4  /  TruthfulQA MC2</text>
  <path d="M1152 374L1430 456" stroke="#C8AE7D" stroke-width="2"/>
  <circle cx="1152" cy="374" r="7" fill="#EEE9E0" stroke="#C8AE7D" stroke-width="3"/>
  <circle cx="1430" cy="456" r="7" fill="#EEE9E0" stroke="#C8AE7D" stroke-width="3"/>
  <g fill="#EEE9E0" font-family="Georgia, 'Times New Roman', serif" font-size="27">
    <text x="1122" y="352">48.01</text><text x="1400" y="433">43.01</text>
  </g>
  <g fill="#929BA9" font-family="Arial, sans-serif" font-size="12">
    <text x="1122" y="402">before</text><text x="1400" y="484">after</text>
  </g>
  <text x="1088" y="548" fill="#D8C393" font-family="Georgia, 'Times New Roman', serif" font-size="25">−5 points</text>
  <text x="1088" y="574" fill="#929BA9" font-family="Arial, sans-serif" font-size="12">Point estimate; not a significance claim.</text>

  <path d="M64 652H1536" stroke="#EEE9E0" stroke-opacity=".13"/>
  <text x="80" y="684" fill="#929BA9" font-family="Arial, sans-serif" font-size="12">Historical runs · see Figures 10–11 and the methods notes below.</text>
  <text x="1520" y="684" fill="#6F7B8F" font-family="Arial, sans-serif" font-size="11" text-anchor="end" letter-spacing="1.2">PARETO LABS  /  EVIDENCE BEFORE SCALE</text>
</svg>
